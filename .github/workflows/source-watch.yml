name: AI chip source watch

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate maintenance data
        run: node scripts/validate-data.mjs
      - name: Scan official sources
        run: node scripts/scan-sources.mjs
      - name: Commit review candidates
        shell: bash
        run: |
          if git diff --quiet -- data/source-state.json data/inbox/candidates.json; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "chipatlas-source-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-state.json data/inbox/candidates.json
          git commit -m "data: update source-watch candidates"
          git push
